1. გაკვეთილზე ნასწავლი თეგები და მათი განმარტებები:

- <!DOCTYPE html> - ატყობინებს ბრაუზერს რომ დოკუმენტი არის HTML5 სტანდარტის.
- <html>- - HTML დოკუმენტის ძირითადი ელემენტი რომელიც მოიცავს მთელ კოდს.
- <head> - შეიცავს ტექნიკურ ინფორმაციას გვერდის შესახებ (სათაური, სტილები, კოდირება).
- <title> - ადგენს ვებ-გვერდის სათაურს, რომელიც ჩანს ბრაუზერის ჩანართზე (Tab-ზე).
- <body> - შეიცავს ვებ-გვერდის ვიზუალურ შინაარსს, რაც მომხმარებლისთვის ჩანს.
- <h1> - <h6> - სათაურების თეგები სადაც <h1> არის ყველაზე მნიშვნელოვანი, ხოლო <h6> ყველაზე მცირე.
- <p> - პარაგრაფის (ტექსტური აბზაცის) შესაქმნელი თეგი.
- <pre> - წინასწარ ფორმატირებული ტექსტის თეგი.
- <b> - ტექსტის ვიზუალურად.
- <strong> - ტექსტის გამუქება.
- <i> - ტექსტის ვიზუალურად დახრა.
- <em> - ესეც ტექსტის დახრა.



2. განსხვავება <p> და <pre> თეგებს შორის:

<p> თეგი ტექსტს სტანდარტულ აბზაცად აფორმებს. ბრაუზერი ავტომატურად აიგნორებს
ზედმეტ სფეისებს და კოდში გაკეთებულ ახალ სტრიქონზე გადასვლებს.
<pre> თეგი კი ზუსტად ისე აჩენს ტექსტს ეკრანზე, როგორც ის კოდშია დაწერილი —
ინარჩუნებს ყველა სფეისს და სტრიქონის გადაყვანას.

3. განსხვავება <b> და <strong> თეგებს შორის:

ვიზუალურად ორივე თეგი ტექსტს ამუქებს, თუმცა მათ შორის დიდი განსხვავებაა
<b> გამოიყენება მხოლოდ ვიზუალური გამუქებისთვის.
<strong> კი მიუთითებს, რომ ტექსტი არის ძალიან მნიშვნელოვანი ან კრიტიკული.
ეკრანის წამკითხველები და საძიებო სისტემები <strong> თეგში ჩასმულ ტექსტს 
განსაკუთრებულ აქცენტს ანიჭებენ.

4. განსხვავება <i> და <em> თეგებს შორის:

ვიზუალურად ორივე თეგი ტექსტს ხრის
<i> გამოიყენება მხოლოდ ვიზუალური დახრისთვის.
<em> ტექსტში მნიშვნელობისა და აქცენტის გამოკვეთა.
